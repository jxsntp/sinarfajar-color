name: inaura-foundation-dev
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: inaura_dev
      POSTGRES_PASSWORD: local-development-only
    volumes:
      - db:/var/lib/postgresql/data
      - ./tests/support/bootstrap.sql:/docker-entrypoint-initdb.d/001-bootstrap.sql:ro
    ports:
      - "127.0.0.1:25422:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d inaura_dev"]
      interval: 2s
      timeout: 3s
      retries: 30
  auth:
    image: supabase/gotrue:v2.186.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      API_EXTERNAL_URL: http://127.0.0.1:25421/auth/v1
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:local-auth-only@db:5432/inaura_dev?search_path=auth
      GOTRUE_SITE_URL: http://127.0.0.1:3000
      GOTRUE_JWT_SECRET: development-only-test-signature-replace-on-hosted-services
      GOTRUE_JWT_EXP: 3600
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
  storage-setup:
    image: postgres:17-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: local-development-only
    volumes:
      - ./tests/support/storage.sql:/setup.sql:ro
    command: ["psql", "-h", "db", "-U", "postgres", "-d", "inaura_dev", "-v", "ON_ERROR_STOP=1", "-f", "/setup.sql"]
  storage:
    image: supabase/storage-api:v1.98.6
    depends_on:
      storage-setup:
        condition: service_completed_successfully
    environment:
      ANON_KEY: ${LOCAL_STORAGE_ANON_KEY:?Run node scripts/local-storage.mjs first}
      SERVICE_KEY: ${LOCAL_STORAGE_SERVICE_KEY:?Run node scripts/local-storage.mjs first}
      AUTH_JWT_SECRET: development-only-test-signature-replace-on-hosted-services
      DATABASE_URL: postgres://supabase_storage_admin:local-storage-only@db:5432/inaura_dev
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      GLOBAL_S3_BUCKET: local
      TENANT_ID: local
      REGION: local
      FILE_SIZE_LIMIT: 4194304
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - photos:/var/lib/storage
  gateway:
    image: nginx:stable-alpine
    depends_on: [auth, storage]
    volumes:
      - ./tests/support/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:25421:80"
volumes:
  db:
  photos:
