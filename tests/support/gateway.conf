server {
    listen 80;
    access_log off;
    client_max_body_size 5m;
    location /storage/v1/ {
        proxy_pass http://storage:5000/;
    }
    location /auth/v1/ {
        proxy_pass http://auth:9999/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
